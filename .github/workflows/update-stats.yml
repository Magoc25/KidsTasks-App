name: Atualizar Estatísticas de Dispositivos Ativos

on:
  schedule:
    - cron: '0 7 * * *'   # 04:00 Brasília (diário)
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Consultar dispositivos ativos (últimos 30 dias)
        id: stats
        env:
          SB_URL: ${{ secrets.REV_SB_URL }}
          SB_KEY: ${{ secrets.REV_SB_KEY }}
        run: |
          THIRTY_DAYS_AGO=$(date -d '30 days ago' +%Y-%m-%d)
          RESPONSE=$(curl -s \
            "${SB_URL}/rest/v1/app_pings?select=device_id&app_name=eq.KidsTasks&ping_date=gte.${THIRTY_DAYS_AGO}" \
            -H "apikey: ${SB_KEY}" \
            -H "Authorization: Bearer ${SB_KEY}")
          COUNT=$(echo "$RESPONSE" | python3 -c "
import sys, json
data = json.load(sys.stdin)
print(len(set(d['device_id'] for d in data)))
")
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "Dispositivos ativos (30d): $COUNT"

      - name: Gravar stats.json
        run: |
          echo "{\"active_30d\":${{ steps.stats.outputs.count }},\"updated_at\":\"$(date +%Y-%m-%d)\"}" > stats.json

      - name: Commit e push
        run: |
          git config user.name "Magoc25"
          git config user.email "129018821+Magoc25@users.noreply.github.com"
          git add stats.json
          git diff --staged --quiet || git commit -m "chore: atualiza contagem de dispositivos ativos"
          git push
