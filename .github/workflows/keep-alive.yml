name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 8 * * *'    # 05:00 Brasília
    - cron: '0 20 * * *'   # 17:00 Brasília
  workflow_dispatch:

# São DOIS projetos Supabase, e por muito tempo só um estava protegido: o compartilhado
# (avaliações/pings/versão) e o PESSOAL, que guarda família, crianças, tarefas e histórico. O plano
# free suspende um projeto após ~7 dias sem atividade — e foi o pessoal que pausou em ago/2026,
# derrubando a sincronização, justamente porque nada o mantinha acordado. Os passos são separados
# de propósito: um projeto fora do ar não pode impedir que o outro receba o próprio ping.
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase compartilhado (avaliações/pings/versão)
        env:
          SB_URL: ${{ secrets.REV_SB_URL }}
          SB_KEY: ${{ secrets.REV_SB_KEY }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SB_URL/rest/v1/app_reviews?select=id&limit=1" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY")
          echo "Status HTTP: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Compartilhado respondeu $STATUS (esperado 200)."
            exit 1
          fi
          echo "Supabase compartilhado ativo."

      # `always()`: se o passo acima falhar, este AINDA roda. Sem isso, uma instabilidade no
      # compartilhado deixaria o pessoal sem ping — e é o pessoal que guarda os dados da família.
      - name: Ping Supabase pessoal (dados da família)
        if: always()
        env:
          SB_URL: ${{ secrets.OWN_SB_URL }}
          SB_KEY: ${{ secrets.OWN_SB_KEY }}
        run: |
          # Falta de secret é FALHA, não "pulei": um keep-alive que silenciosamente não roda é
          # exatamente como o projeto pausa de novo, e o vermelho aqui é a única coisa que avisa.
          if [ -z "$SB_URL" ] || [ -z "$SB_KEY" ]; then
            echo "::error::Secrets OWN_SB_URL / OWN_SB_KEY ausentes — o Supabase PESSOAL segue sem keep-alive e pausa em ~7 dias sem uso."
            echo "Crie os dois em Settings → Secrets and variables → Actions (os valores são os mesmos que estão em Configurações → Supabase, dentro do app)."
            exit 1
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SB_URL/rest/v1/families?select=id&limit=1" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY")
          echo "Status HTTP: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Pessoal respondeu $STATUS (esperado 200) — projeto pausado, chave trocada ou RLS alterada."
            exit 1
          fi
          echo "Supabase pessoal ativo."
