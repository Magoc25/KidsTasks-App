name: Smoke (§35)
on:
  push:
    branches: [master]
    paths-ignore: ['stats.json']   # commit diário de stats não roda o smoke
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — o cenário do r69(c) roda o BUILD ANTERIOR como 2º aparelho, buscado com
      # `git show <sha>:KidsTasks.html`. No clone raso padrão esse objeto não existe e a suíte sai
      # como INCONCLUSIVA (nunca verde, r74a) — mas o certo é ela rodar de verdade.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      # --no-save --no-package-lock: o repo fica SEM package.json de propósito (r33 — node_modules
      # e lockfile em pasta do OneDrive travam o sync da máquina inteira). A dependência do teste
      # vive só aqui, no runner descartável.
      - name: Instalar jsdom
        run: npm install --no-save --no-package-lock jsdom
      - name: Smoke §35 (2 devices contra um Supabase falso)
        run: node tests/smoke.js
        env: { CI: 'true' }
